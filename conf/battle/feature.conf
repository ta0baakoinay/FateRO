// [AutoBuff] Prefix player name with autobuff by [BUFF]
feature.autobuff_prefixname: on

// [AutoBuff] Enable usage of hat effect when enabled, list of id is in autobuff.hpp - AB_HATEFFECTS
feature.autobuff_hateffect: on

// [AutoBuff] Set a hard delay for buff skills (avoid skills with delay on client side only to be flooded) 100 = 1s
feature.autobuff_bskill_delay: 100

// [Auto Support] Whether Auto Support (AutoBuff) may TELEPORT to catch up to the
// player it is following when it cannot walk there.
// Accepts either a keyword or a number:
//     no        (0) : never teleport - walk only
//     samemap   (1) : teleport only while both are on the SAME map
//     anywhere  (2) : also teleport across maps
// This NEVER bypasses instance ownership or map-flag teleport/warp rules
// (NoTeleport / NoWarp / NoReturn / GvG / BG / a different instance all block it).
// Runtime override: @autosupport allowteleport <no|samemap|anywhere> (GM).
feature.autobuff_teleportiflost: samemap

// [AutoBuff] Ratio to apply on autobuff drop : 0 means there is no drop, 100 means it's normal, 200 is x2 etc..
feature.autobuff_drop_ratio: 100

// [AutoBuff] Ratio to apply on autobuff exp : 0 means there is no exp, 100 means it's normal, 200 is x2 etc..
feature.autobuff_exp_ratio: 100

// [AutoBuff] Allow in town (on mean enabled in town, off disabled)
feature.autobuff_allow_town: off

// [AutoBuff] Allow in pvp
feature.autobuff_allow_pvp: off

// [AutoBuff] Allow in gvg
feature.autobuff_allow_gvg: off

// [AutoBuff] Allow in bg
feature.autobuff_allow_bg: off

// [AutoBuff] AutoBuff Device duration based on
// 0 : Scale on item rental time, if the item is not a rental item, it won't start
// 1 : Scale on a account variable #ab_duration, you will need to add timer for player in a script / npc
feature.autobuff_duration_type: 0

// [AutoBuff] AutoBuff timer between each loop
// 500 = 0,5s = 500ms
feature.autobuff_timer: 500

// [AutoBuff] AutoBuff limitation by ip
// 0 = unlimit, 1 = 1 autobuff player by ip etc...
feature.autobuff_iplimit: 3

// [AutoBuff] AutoBuff limitation by fateshield unique id (you need to uncomment 2 parts in autobuff.cpp
// where there is this string : Uncomment this if you have fateshield and want to set a limit
// 0 = unlimit, 1 = 1 autobuff player by ip etc...
feature.autobuff_fateshieldlimit: 0

// [AutoBuff] EXP and Drop Rate Penalties
// Percentage of original rates to apply during auto buff (100 = no penalty, 30 = 70% reduction)
feature.autobuff_drop_rate_penalty: 30
feature.autobuff_base_exp_penalty: 30
feature.autobuff_job_exp_penalty: 30