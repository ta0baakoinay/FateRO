//--------------------------------------------------------------
// Easycore Works - Configuration File
//--------------------------------------------------------------
// Note 1: Value is a config switch (on/off, yes/no or 1/0)
// Note 2: Value is in percents (100 means 100%)
//--------------------------------------------------------------

// Extended Vending System [Lilith / Easycore]
// Enable or disable extended vending system? (Note 1)
extended_vending: on

// Show broadcast info when a player clicks a vending board? (Note 1)
show_broadcast_info: on

// Show currency's name in the vending board title? (Note 1)
show_item_vending: on

// Show more info about a purchase to the vendor? (Note 1)
ex_vending_info: on

// Send a Vending Report to the vendor's mailbox/rodex? (Note 1)
// NOTE: set the permanent player variable 'NOVREPORT' to 1 to opt out of these mails.
ex_vending_report: on

// Allow buying items with bound items as currency? (Note 1)
// WARNING: players might dupe items - keep OFF.
ex_buying_bound: off

// Item ID used as the "pay with Zeny" currency icon. 0 = no zeny option.
item_zeny: 30001

// Item ID used as the "pay with Cash" currency icon. 0 = no cash option.
item_cash: 0
