// --------------------------------------------------------------
// Master NPC list for a SHARDED grind map-server (map-server2).
// Loaded instead of scripts_main.conf via  npc_scripts_main:  in
// conf/map_athena_b.conf.  A grind shard owns only field/dungeon
// maps, so it loads ONLY: global functions, mapflags, mob spawns,
// warps, and a few floating QoL utilities.  Town / WoE / BG /
// instance / quest / event / ladder scripts stay on the main
// map-server which owns those maps.
// --------------------------------------------------------------
npc: npc/other/Global_Functions.txt
npc: npc/other/CashShop_Functions.txt

import: npc/scripts_mapflags.conf
import: npc/scripts_monsters.conf
import: npc/scripts_warps.conf

import: npc/pre-re/scripts_mapflags.conf
import: npc/pre-re/scripts_monsters.conf
import: npc/pre-re/scripts_warps.conf

import: npc/scripts_custom_shard.conf
