#   900 FATE_ARMOR  901 FATE_SHIELD  902 FATE_GARMENT  903 FATE_BOOTS  904 FATE_WEAPON
#
# Slots 1-3 are all guaranteed so apply() always produces 3 weighted options.
# HOW MANY of those an item actually keeps is decided per acquisition path:
#   - monster drop : feature.random_options_drop_opt1/opt2/opt3 (conf/battle/feature.conf)
#   - refine / NPC : all 3 kept (NPC only ever reads/replaces one slot)
#
# Value rarity tiers inside each slot:
#   basic stats : +1 = 9000 , +2 = 500 , +3 = 200
#   1-5 values  :  1 = 9000 , 2 = 3000 , 3 = 1000 , 4 = 500 , 5 = 200
# ===========================================================================
