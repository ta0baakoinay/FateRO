  - Id: 90000
    AegisName: AP_Potion
    Name: AP Recovery Potion
    Type: Usable
    Buy: 5000
    Weight: 10
    Script: |
      .@amount = 30;
      .@ceiling = #AC_MaxAP;
      if (#AC_AP >= .@ceiling) {
        dispbottom "Your AP is already at maximum.";
      } else {
        #AC_AP = #AC_AP + .@amount;
        if (#AC_AP > .@ceiling) #AC_AP = .@ceiling;
        MaxAp = #AC_MaxAP;
        Ap = #AC_AP;
        dispbottom "AP restored! Current AP: " + #AC_AP + " minutes.";
      }

