###########################################################################
# Population Engine — Shared Gear Sets Database
###########################################################################
#
# Loaded by every population engine database (main, pvp, vendor). Job entries
# reference these GearSets by name via  GearSet: <name>.
#
# DIVERSITY: every slot is a POOL and one entry is picked at random per fake
# player, so two fake players of the same job look different. Pools deliberately
# mix weak / average / stronger pre-renewal items (and include `0` = empty in
# optional slots) so a crowd looks like a real, progressed player population
# rather than clones. Every item is a real pre-renewal AegisName from
# db/pre-re/item_db_equip.yml; if a rolled item is invalid for the fake player's
# job or level, pc_equipitem simply rejects it and the guaranteed-weapon /
# empty-slot fallbacks apply — nothing nonsensical is worn.
#
###########################################################################

Header:
  Type: POPULATION_ENGINE_DB
  Version: 2

