###########################################################################
# Population Vendor Database                                              #
###########################################################################
#
# Defines named vendor configurations for population shells.
# Reference a config from db/population_engine.yml using:   VendorKey: "name"
#
# ---------------------------------------------------------------------------
# VendorKey: "name"
#   Unique identifier referenced by VendorKey: in population_engine.yml.
#
# Title: "text"
#   Overhead shop title shown to nearby players (default: "Shop").
#
# Type: static | dynamic   (default: static)
#   static  — sell the items listed in the Stock: block below.
#   dynamic — derive the item list from the drop tables of mobs spawned on the
#             same map at load time.  Stock: is ignored when Type is dynamic.
#
# MaxSlots: N   (1–12, default 12)
#   Maximum number of distinct items in the vend (cap: MC_VENDING lv10 = 12).
#
# PriceMultiplier: N   (default 100)
#   Used by dynamic vendors only.  Price = item sell value * N / 100.
#   E.g. 150 = 150% of sell value.  Ignored for static vendors (use Price: per item).
#
# SourceMaps: [map1, map2, ...]   (dynamic vendors only)
#   Explicit list of source maps to scan for mob drops.  Overrides SourceCategory.
#   When omitted, the vendor falls back to SourceCategory or the spawn map.
#
# SourceCategory: dungeon | field | both   (dynamic vendors only)
#   Auto-discover source maps from population_engine.yml spawn lists.
#     dungeon — every map listed under any entry's dungeons:
#     field   — every map listed under any entry's fields:
#     both    — union of fields + dungeons
#   Ignored when SourceMaps: is set.
#
# RandomizePerShell: true | false   (default false)
#   When true, each spawned vendor shell picks ONE source map at random
#   so multiple shells stock different items.  When false, drops from
#   ALL source maps are merged into a single pool (top max_slots by rate).
#
# ItemFlags:                       (dynamic vendors only)
#   AllowEquipment: true | false   (default false) — armor/weapons (item.equip != 0)
#   AllowCards:     true | false   (default false) — IT_CARD
#   AllowEtc:       true | false   (default true)  — IT_ETC (mats, junk loot)
#   AllowUsable:    true | false   (default true)  — IT_HEALING / IT_USABLE / IT_DELAYCONSUME
#
# MaxAmount: [min, max]            (dynamic vendors only — default [30,30])
#   Per-item stack-size randomization range. Each generated stockpile rolls
#   a random integer in [min, max].  Equipment is always capped to 1.
#   A single scalar (MaxAmount: 500) is treated as [1, 500].
#   Hard-capped at 30000.
#
# Stock: (sequence — static vendors only)
#   - Item: AegisName or numeric item_id   (required)
#     Amount: N                             (default 1)
#     Price: N                              (default 0 = use item buy price)
#     AmountRange: [lo, hi]                 (RandomizeStock only) per-vendor qty roll
#     PickWeight: N                         (RandomizeStock only, default 1) selection
#                                           weight — higher = more likely / "specialty"
#
# RandomizeStock: true | false   (default false, Static entries only)
#   Treats Stock: as a candidate POOL. Every vendor independently rolls its own
#   subset of items, per-item quantity (AmountRange or Amount/4 .. Amount) and
#   price (base +/- PriceVariancePct), so 100 vendors on one key all look like
#   different players' shops. The 8000 Pushcart weight cap is still enforced.
#     StockItems: [min, max]     distinct item count per vendor (default [3, pool])
#     PriceVariancePct: N        +/- % jitter on each item price (default 0 = exact)
#     SpecialtyPct: N            % of vendors that become "bulk specialists"
#                                (1-3 item types, much larger stacks)
#
# RandomizeShopName: true | false   (default = RandomizeStock's value)
#   Ignore Title: and generate a casual, player-style vend name per vendor
#   (trader shorthand / afk / funny / item-flavoured / "<name>'s shop" / ...).
#
# VendorPlacement: (optional)
#   Restricts where shells of this vendor stand. When ANY vendor entry has a
#   VendorPlacement block, vendor-behavior shells are restricted to listed
#   maps only (vendors won't spawn on towns/fields/dungeons that aren't in
#   any VendorPlacement).
#     Map:        Map name (required, e.g. maintown).
#     MinSpacing: Minimum cells between two vendor shells (0 = off).
#     MaxVendors: Hard cap on simultaneous vendor shells on this map (0 = no cap).
#     Area:       Optional bounding box {X1, Y1, X2, Y2}. Y in map coords
#                 (0 = bottom). Lower-left + upper-right; min/max auto-normalized.
#                 Omit Area: to allow the whole map.
#   Note: placements are merged per Map across the whole file. If two vendor
#   entries declare the same Map, the last one parsed wins (warning logged).
# ---------------------------------------------------------------------------

Header:
  Type: POPULATION_VENDORS_DB
  Version: 1

Body:
  # ------------------------------------------------------------------
  # Static vendor: general consumables (potions, fly/butter wings, misc)
  # ------------------------------------------------------------------
  - VendorKey: "potions"
    Title: "[Potions]"          # ignored while RandomizeShopName is on
    Type: Static
    # Stock: below is a candidate POOL. Every vendor rolls its own subset,
    # per-item quantity (AmountRange), and price (+/- PriceVariancePct), so 100
    # "potions" vendors all look like different players' AFK shops.
    RandomizeStock: true
    RandomizeShopName: true
    StockItems: [2, 6]          # how many distinct items this vendor sells
    PriceVariancePct: 18        # each item price = base +/- up to 18%
    SpecialtyPct: 30            # 30% of vendors are "bulk specialists" (1-3 items, big stacks)
    MaxSlots: 12
    Stock:
      - { Item: Red_Potion,        AmountRange: [40, 700], PickWeight: 10 }
      - { Item: Orange_Potion,     AmountRange: [30, 400], PickWeight: 7  }
      - { Item: Yellow_Potion,     AmountRange: [20, 250], PickWeight: 5  }
      - { Item: White_Potion,      AmountRange: [20, 220], PickWeight: 8  }
      - { Item: Green_Potion,      AmountRange: [20, 300], PickWeight: 4  }
      - { Item: Blue_Potion,       AmountRange: [10, 180], PickWeight: 4  }
      - { Item: Wing_Of_Fly,       AmountRange: [20, 250], PickWeight: 5  }
      - { Item: Wing_Of_Butterfly, AmountRange: [10, 120], PickWeight: 3  }
      - { Item: Anodyne,           AmountRange: [10, 200], PickWeight: 2  }
      - { Item: Aloevera,          AmountRange: [10, 200], PickWeight: 2  }
      - { Item: Center_Potion,     AmountRange: [10, 90],  PickWeight: 2  }
      - { Item: Awakening_Potion,  AmountRange: [10, 90],  PickWeight: 2  }
    VendorPlacement:
      Map: maintown
      MinSpacing: 2
      MaxVendors: 100
      # Bounding box: Y is in map coordinates (0 = bottom).
      # Use lower-left + upper-right; min/max are auto-normalized.
      Area:
        X1: 50
        Y1: 46
        X2: 149
        Y2: 149
  # ------------------------------------------------------------------
  # Static vendor: buff potions (pre-cast potions for adventurers)
  # ------------------------------------------------------------------
  - VendorKey: "buff_shop"
    Title: "[Buff Items]"
    Type: Static
    RandomizeStock: true
    RandomizeShopName: true
    StockItems: [2, 5]
    PriceVariancePct: 20
    SpecialtyPct: 25
    Stock:
      - { Item: Center_Potion,    AmountRange: [15, 150], PickWeight: 6 }
      - { Item: Awakening_Potion, AmountRange: [15, 150], PickWeight: 6 }
      - { Item: Berserk_Potion,   AmountRange: [8,  90],  PickWeight: 4 }
      - { Item: Poison_Bottle,    AmountRange: [5,  50],  PickWeight: 2 }
      - { Item: Holy_Water,       AmountRange: [20, 300], PickWeight: 5 }
      - { Item: Panacea,          AmountRange: [10, 150], PickWeight: 3 }
      - { Item: Magnifier,        AmountRange: [10, 200], PickWeight: 3 }
    VendorPlacement:
      Map: maintown
      MinSpacing: 2
      MaxVendors: 100
      # Bounding box: Y is in map coordinates (0 = bottom).
      # Use lower-left + upper-right; min/max are auto-normalized.
      Area:
        X1: 50
        Y1: 46
        X2: 149
        Y2: 149
  # ------------------------------------------------------------------
  # Static vendor: arrows and ammunition
  # ------------------------------------------------------------------
  - VendorKey: "ammo_shop"
    Title: "[Ammo & Arrows]"
    Type: Static
    RandomizeStock: true
    RandomizeShopName: true
    StockItems: [2, 5]
    PriceVariancePct: 15
    SpecialtyPct: 40           # arrow sellers often dump one arrow type in bulk
    Stock:
      - { Item: Arrow,                  AmountRange: [200, 5000], PickWeight: 10 }
      - { Item: Silver_Arrow,           AmountRange: [150, 3000], PickWeight: 6  }
      - { Item: Fire_Arrow,             AmountRange: [150, 3000], PickWeight: 6  }
      - { Item: Stone_Arrow,            AmountRange: [150, 3000], PickWeight: 5  }
      - { Item: Crystal_Arrow,          AmountRange: [150, 3000], PickWeight: 5  }
      - { Item: Holy_Arrow,             AmountRange: [100, 2000], PickWeight: 4  }
      - { Item: Steel_Arrow,            AmountRange: [100, 2000], PickWeight: 4  }
      - { Item: Iron_Arrow,             AmountRange: [100, 2000], PickWeight: 4  }
      - { Item: Rusty_Arrow,            AmountRange: [50,  1000], PickWeight: 2  }
      - { Item: Wind_Arrow_Container,   AmountRange: [10,  200],  PickWeight: 2  }
      - { Item: Shadow_Arrow_Container, AmountRange: [10,  200],  PickWeight: 2  }
      - { Item: Iron_Arrow_Container,   AmountRange: [10,  200],  PickWeight: 2  }
    VendorPlacement:
      Map: maintown
      MinSpacing: 2
      MaxVendors: 100
      # Bounding box: Y is in map coordinates (0 = bottom).
      # Use lower-left + upper-right; min/max are auto-normalized.
      Area:
        X1: 50
        Y1: 46
        X2: 149
        Y2: 149
  # ------------------------------------------------------------------
  # Static vendor: equipment basics (weapons, armor for new players)
  # ------------------------------------------------------------------
  - VendorKey: "equip_shop"
    Title: "[Equipment]"
    Type: Static
    MaxSlots: 12
    RandomizeStock: true
    RandomizeShopName: true
    StockItems: [2, 6]
    PriceVariancePct: 25       # gear prices vary more between players
    SpecialtyPct: 10
    Stock:
      # Equipment is non-stackable — Amount is forced to 1 per vend slot.
      - { Item: Knife,        Amount: 1,   Price: 500,  PickWeight: 4 }
      - { Item: Sword,        Amount: 1,   Price: 1200, PickWeight: 3 }
      - { Item: Guard,        Amount: 1,   Price: 800,  PickWeight: 3 }
      - { Item: Buckler,      Amount: 1,   Price: 1500, PickWeight: 3 }
      - { Item: Cotton_Shirt, Amount: 1,   Price: 200,  PickWeight: 4 }
      - { Item: Sandals,      Amount: 1,   Price: 150,  PickWeight: 4 }
      - { Item: Hood,         Amount: 1,   Price: 300,  PickWeight: 3 }
      - { Item: Apple,        AmountRange: [20, 300], Price: 10, PickWeight: 2 }
    VendorPlacement:
      Map: maintown
      MinSpacing: 2
      MaxVendors: 100
      # Bounding box: Y is in map coordinates (0 = bottom).
      # Use lower-left + upper-right; min/max are auto-normalized.
      Area:
        X1: 50
        Y1: 46
        X2: 149
        Y2: 149
  # ------------------------------------------------------------------
  # Dynamic vendor: sells items from FIELD mob drop tables across all
  # maps that any spawn entry lists under fields:.  Each shell rolls
  # one source map at spawn time so multiple field-drop vendors stock
  # different items.  Equipment/cards excluded by default.
  # ------------------------------------------------------------------
  - VendorKey: "field_drops"
    Title: "Field Loots"
    Type: Dynamic
    RandomizeShopName: true
    MaxSlots: 12
    MaxAmount: [1, 30000]          # randomize stack size per item (equipment auto-capped to 1)
    PriceMultiplier: 130
    SourceCategory: field          # auto-discover all field maps from population_engine.yml
    RandomizePerShell: true        # each shell picks ONE source map -> stock variety
    ItemFlags:
      AllowEquipment: false
      AllowCards: false
      AllowEtc: true
      AllowUsable: true
    VendorPlacement:
      Map: maintown
      MinSpacing: 2
      MaxVendors: 100
      # Bounding box: Y is in map coordinates (0 = bottom).
      # Use lower-left + upper-right; min/max are auto-normalized.
      Area:
        X1: 50
        Y1: 46
        X2: 149
        Y2: 149

  # ------------------------------------------------------------------
  # Dynamic vendor: dungeon drops at a higher markup.  Allows equipment
  # so players can browse rare gear without farming.
  # ------------------------------------------------------------------
  - VendorKey: "dungeon_drops"
    Title: "Dungeon Loots"
    Type: Dynamic
    RandomizeShopName: true
    MaxSlots: 12
    MaxAmount: [1, 30000]          # randomize stack size per item (equipment auto-capped to 1)
    PriceMultiplier: 160
    SourceCategory: dungeon        # auto-discover all dungeon maps
    RandomizePerShell: true
    ItemFlags:
      AllowEquipment: true         # let dungeon vendors stock gear
      AllowCards: false            # cards stay rare/expensive elsewhere
      AllowEtc: true
      AllowUsable: true
    VendorPlacement:
      Map: maintown
      MinSpacing: 2
      MaxVendors: 100
      # Bounding box: Y is in map coordinates (0 = bottom).
      # Use lower-left + upper-right; min/max are auto-normalized.
      Area:
        X1: 50
        Y1: 46
        X2: 149
        Y2: 149
  # ------------------------------------------------------------------
  # Example: explicit per-map dynamic vendor.
  # Use SourceMaps: instead of SourceCategory: when you want a specific
  # set of source maps (e.g. only Prontera Sewers + Geffen Dungeon).
  # ------------------------------------------------------------------
  # - VendorKey: "sewer_drops"
  #   Title: "[Sewer Goods]"
  #   Type: Dynamic
  #   MaxSlots: 12
  #   PriceMultiplier: 140
  #   SourceMaps:
  #     - prt_sewb1
  #     - prt_sewb2
  #     - prt_sewb3
  #   RandomizePerShell: false     # merge drops from all listed maps
  #   ItemFlags:
  #     AllowEquipment: false
  #     AllowCards: false
