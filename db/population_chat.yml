###########################################################################
# Population Engine Chat Database  —  Tagalog / Taglish
###########################################################################
#
# Ambient map chat + whisper/mention replies for fake players. Short, casual,
# Filipino-server style: mostly Tagalog/Taglish with RO slang. Keep lines short.
#
#   - ChatGlobal.Categories:  <name>: [ "line", ... ]   shared line pools
#   - ChatProfile: <key>       Categories: [ names ]     a "personality" = a set
#                                                        of categories to draw from
#
# Referenced from db/population_engine.yml via  ChatProfile: <key>
# (omit ChatProfile: on a profile -> uses "default").
#
# Placeholders usable in any line:  {name}  {map}  {job}
# Lines matching a db/population_names.yml Blocklist entry are skipped.
#
# Frequency is NOT controlled here. It is controlled by:
#   conf/battle/population_engine.conf:
#     population_engine_chat_enable          on/off master switch
#     population_engine_chat_speak_chance    per-tick % a shell off cooldown speaks
#     population_engine_chat_cooldown_ms     min gap between a shell's lines
#     population_engine_chat_cooldown_jitter_ms
#     population_engine_chat_max_per_tick    cap so a crowd never all speak at once
#     population_engine_chat_reply_enable    reply to whisper / name mention
#   plus a per-shell random "chattiness" personality weight (quiet..talkative).
###########################################################################

Header:
  Type: POPULATION_CHAT_DB
  Version: 1

